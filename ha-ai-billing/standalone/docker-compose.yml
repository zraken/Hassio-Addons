name: ha-ai-billing

services:
  ha-ai-billing:
    build: ..
    image: ha-ai-billing:latest
    container_name: ha-ai-billing
    env_file: .env
    environment:
      CONFIG_PATH: /config/config.yaml
      # Broker uses a self-signed cert; opted to trust it on the LAN.
      # To verify properly: remove this, drop the CA cert at ./ca.crt,
      # mount it at /config/ca.crt and set MQTT_CA_CERT=/config/ca.crt.
      MQTT_TLS_INSECURE: "true"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    user: "1000:1000"
    restart: unless-stopped
